<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            padding: 35px;
            width: 400px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px #aaa;
        }

        input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>QR Code Generator</h1>

    <input type="text" id="text" placeholder="Enter text or URL">

    <br>

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>
</div>

<script>
function generateQR() {

    let text = document.getElementById("text").value;

    if (text.trim() === "") {
        alert("Please enter text");
        return;
    }

    // Remove previous QR code
    document.getElementById("qrcode").innerHTML = "";

    // Generate QR code
    new QRCode(document.getElementById("qrcode"), {
        text: text,
        width: 200,
        height: 200
    });
}
</script>

</body>
</html>
